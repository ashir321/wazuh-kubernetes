apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: wazuh
spec:
  selector:
    matchLabels:
      app: wazuh-agent
  template:
    metadata:
      labels:
        app: wazuh-agent
    spec:
      hostNetwork: false
      hostPID: true
      hostIPC: false
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.3
          env:
            - name: WAZUH_MANAGER_SERVER
              value: "wazuh-workers.wazuh.svc.cluster.local"
            - name: WAZUH_MANAGER_PORT
              value: "1514"
            - name: WAZUH_REGISTRATION_SERVER
              value: "wazuh.wazuh.svc.cluster.local"
            - name: WAZUH_REGISTRATION_PORT
              value: "1515"
            - name: WAZUH_REGISTRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-authd-pass
                  key: authd.pass
            - name: WAZUH_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: "unix:///run/containerd/containerd.sock"
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Install Grype vulnerability scanner
                    curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

                    # Install crictl for container image detection via CRI socket
                    CRICTL_VERSION="v1.29.0"
                    ARCH=$(uname -m)
                    case "$ARCH" in
                      x86_64)  CRICTL_ARCH="amd64" ;;
                      aarch64) CRICTL_ARCH="arm64" ;;
                      *)       CRICTL_ARCH="amd64" ;;
                    esac
                    curl -sSfL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-${CRICTL_ARCH}.tar.gz" \
                      | tar -C /usr/local/bin -xzf - 2>/dev/null || true

                    # Copy the Grype scan script from the ConfigMap
                    mkdir -p /var/ossec/custom-script
                    cp /grype-config/grype_scan.sh /var/ossec/custom-script/grype_scan.sh
                    chmod +x /var/ossec/custom-script/grype_scan.sh

                    # Wait for ossec.conf to be generated by the entrypoint
                    for i in $(seq 1 90); do
                      [ -f /var/ossec/etc/ossec.conf ] && break
                      sleep 1
                    done

                    # Append Grype wodle configuration as a new ossec_config block
                    if [ -f /var/ossec/etc/ossec.conf ] && ! grep -q "grype_scan" /var/ossec/etc/ossec.conf; then
                      cat >> /var/ossec/etc/ossec.conf <<'GRYPE_EOF'

                    <ossec_config>
                      <!-- Grype container vulnerability scanner -->
                      <wodle name="command">
                        <disabled>no</disabled>
                        <tag>grype</tag>
                        <command>/var/ossec/custom-script/grype_scan.sh</command>
                        <interval>1d</interval>
                        <ignore_output>no</ignore_output>
                        <run_on_start>yes</run_on_start>
                        <timeout>1800</timeout>
                      </wodle>
                    </ossec_config>
                    GRYPE_EOF
                    fi

                    # Wait for the agent to fully start, then restart it so
                    # it picks up the wodle configuration appended above
                    for i in $(seq 1 60); do
                      if /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "running"; then
                        sleep 5
                        /var/ossec/bin/wazuh-control restart 2>/dev/null || true
                        break
                      fi
                      sleep 2
                    done
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Gracefully stop the Wazuh agent so it deregisters active responses
                    /var/ossec/bin/wazuh-control stop 2>/dev/null || true

                    # Flush any iptables rules added by Wazuh active response
                    # Save current rules, remove wazuh-related entries, restore clean rules
                    if command -v iptables-save &>/dev/null; then
                      iptables-save | grep -iv "wazuh\|ossec" | iptables-restore 2>/dev/null || true
                      ip6tables-save | grep -iv "wazuh\|ossec" | ip6tables-restore 2>/dev/null || true
                    fi

                    # Remove any DROP rules that the active response firewall-drop may have added
                    # These rules block IPs and persist on the host after pod deletion
                    iptables -S INPUT 2>/dev/null | grep -i "DROP" | grep -iv "\-\-comment" | while read -r rule; do
                      iptables $(echo "$rule" | sed 's/^-A/-D/') 2>/dev/null || true
                    done
                    iptables -S FORWARD 2>/dev/null | grep -i "DROP" | grep -iv "\-\-comment" | while read -r rule; do
                      iptables $(echo "$rule" | sed 's/^-A/-D/') 2>/dev/null || true
                    done

                    # Clean up any custom chains created by Wazuh
                    for chain in $(iptables -L -n 2>/dev/null | grep "^Chain" | awk '{print $2}' | grep -i "wazuh\|ossec"); do
                      iptables -F "$chain" 2>/dev/null || true
                      iptables -X "$chain" 2>/dev/null || true
                    done
          volumeMounts:
            - name: host-var-log
              mountPath: /var/log
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: custom-script
              mountPath: /var/ossec/custom-script
            - name: host-docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: grype-agent-config
              mountPath: /grype-config
              readOnly: true
            - name: host-containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            - name: dev
              mountPath: /host/dev
              readOnly: true
            - name: boot
              mountPath: /host/boot
              readOnly: true
            - name: usr
              mountPath: /host/usr
              readOnly: true
            - name: run
              mountPath: /host/run
              readOnly: true
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: sys
          hostPath:
            path: /sys
        - name: etc
          hostPath:
            path: /etc
        - name: dev
          hostPath:
            path: /dev
        - name: boot
          hostPath:
            path: /boot
        - name: usr
          hostPath:
            path: /usr
        - name: run
          hostPath:
            path: /run
        - name: host-var-log
          hostPath:
            path: /var/log
        - name: host-proc
          hostPath:
            path: /proc
        - name: custom-script
          emptyDir: {}
        - name: grype-agent-config
          configMap:
            name: grype-agent-config
        - name: host-docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: host-containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
